<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AeroGlass Nav</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="map" class="map-dark-filter"></div>

    <aside class="sidebar glass" id="sidebarPanel">
        <div class="sidebar-resizer" id="sidebarResizer" title="Trascina per ridimensionare"></div>
        
        <div class="brand">
            <div style="display: flex; align-items: baseline; gap: 6px; overflow: hidden;">
                <h1>AEROGLASS NAV</h1>
                <span style="font-size: 11px; color: var(--text-muted); white-space: nowrap;">by EddiZor</span>
            </div>
            <span style="font-size: 11px; color: var(--text-muted); margin-left: 6px;">v0.3.0</span>
        </div>
        
        <div class="action-row">
            <button class="btn-action" onclick="importPlnFile()">📂 Importa .pln</button>
            <button class="btn-action btn-simbrief" id="simbriefCompactBtn" style="display: none;" onclick="fetchSimbriefPlan()" title="Ricarica l'ultimo OFP da SimBrief">✈️ Ricarica SimBrief</button>
            <button class="btn-icon-muted" id="simbriefEditIdBtn" style="display: none;" onclick="showSimbriefBox()" title="Modifica SimBrief User ID">⚙️</button>
        </div>
        
        <div class="simbrief-box" id="simbriefSetupBox">
            <input type="password" id="simbriefIdInput" placeholder="SimBrief User ID (es. 123456)" onchange="saveSimbriefId(this.value)">
            <button class="btn-action btn-simbrief" style="width: auto; padding: 6px 12px;" onclick="fetchSimbriefPlan()">✈️ SimBrief</button>
        </div>

        <div class="search-box">
            <input type="text" id="omniSearch" placeholder="Cerca ICAO o Aeroporto..." oninput="filterAirports(this.value)">
        </div>
        <div class="section-title">Piano di Volo Attivo</div>
        <div class="fpl-list" id="fplContainer"></div>
    </aside>

    <div class="top-right">
        <button id="btnFollowAcft" class="glass btn-follow active" onclick="toggleFollowAircraft()" title="Attiva/Disattiva centraggio automatico sull'aereo">
            🎯 Segui Aereo: ON
        </button>

        <select id="mapStyleSelect" class="glass layer-select" onchange="switchMapStyle(this.value)">
            <option value="dark">Mappa: IFR Dark Cockpit</option>
            <option value="topo">Mappa: VFR Topo (Rilievi)</option>
            <option value="sat">Mappa: Satellite (Esri)</option>
        </select>

        <div class="telemetry-pill glass">
            <div><span id="simDot" class="status-dot"></span><span id="simStatus">DEMO</span></div>
            <div>ACFT: <strong id="valAcft">MSFS 2024</strong></div>
            <div>ALT: <strong id="valAlt">---</strong> ft</div>
            <div>GS: <strong id="valGs">---</strong> kt</div>
            <div>HDG: <strong id="valHdg">---</strong>°</div>
        </div>
    </div>

    <div class="elevation-drawer glass" id="elevationDrawer">
        <div class="drawer-header">
            <span id="vnavText">Profilo Altitudinale & Terreno (VNAV Multi-Step)</span>
            <button class="drawer-toggle" onclick="toggleDrawer()">[ Riduci / Espandi ]</button>
        </div>
        <div class="elevation-canvas-container">
            <svg width="100%" height="52px" preserveAspectRatio="none" viewBox="0 0 1000 50" style="width:100%; height:100%;">
                <path id="vnavPath" d="M0,50 L0,35 Q250,15 500,28 T1000,40 L1000,50 Z" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="1.5"/>
                <line id="acftVnavLine" x1="0" y1="0" x2="0" y2="50" stroke="#34d399" stroke-width="2" style="display:none;" />
                <line id="mouseVnavLine" x1="0" y1="0" x2="0" y2="50" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" style="display:none;" />
            </svg>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
