<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AeroGlass Nav</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.86);
            --border-glass: rgba(148, 163, 184, 0.2);
            --cyan: #38bdf8;
            --magenta: #e879f9;
            --emerald: #34d399;
            --amber: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; color: var(--text-main); }
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #090d16; }

        .map-dark-filter .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(88%) contrast(92%) saturate(75%);
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }

        .sidebar {
            position: absolute; top: 16px; left: 16px; bottom: 130px; width: 360px;
            z-index: 10; display: flex; flex-direction: column; padding: 14px; gap: 10px;
            transition: bottom 0.3s ease;
        }
        .brand { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 8px; }
        .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; color: var(--cyan); }
        
        .btn-action {
            width: 100%; padding: 7px; background: rgba(56, 189, 248, 0.15); border: 1px solid var(--cyan);
            color: var(--cyan); border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; text-align: center;
        }
        .btn-action:hover { background: rgba(56, 189, 248, 0.3); }

        .btn-simbrief {
            background: rgba(232, 121, 249, 0.15); border-color: var(--magenta); color: var(--magenta);
        }
        .btn-simbrief:hover { background: rgba(232, 121, 249, 0.3); }

        .simbrief-box {
            display: flex; gap: 6px; align-items: center; background: rgba(30, 41, 59, 0.5);
            padding: 8px; border-radius: 8px; border: 1px solid var(--border-glass);
        }
        .simbrief-box input {
            flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-glass);
            background: rgba(15, 23, 42, 0.9); color: var(--text-main); font-size: 12px; outline: none; font-family: monospace;
        }
        .simbrief-box input:focus { border-color: var(--magenta); }

        .search-box input {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-glass);
            background: rgba(15, 23, 42, 0.9); color: var(--text-main); font-size: 13px; outline: none;
        }
        .search-box input:focus { border-color: var(--cyan); }

        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-top: 2px; }
        .fpl-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
        .wpt-card {
            padding: 8px 10px; border-radius: 8px; background: rgba(30, 41, 59, 0.65);
            border-left: 3px solid var(--magenta); display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .wpt-card:hover { background: rgba(51, 65, 85, 0.85); }
        .wpt-icao { font-weight: 700; font-size: 13px; color: var(--cyan); }
        .wpt-name { font-size: 11px; color: var(--text-muted); }

        .top-right {
            position: absolute; top: 16px; right: 16px; z-index: 10;
            display: flex; gap: 10px; align-items: center;
        }
        .layer-select { padding: 8px 12px; color: var(--text-main); font-size: 12px; font-weight: 600; cursor: pointer; outline: none; }
        .layer-select option { background: #0f172a; color: #f8fafc; }
        .telemetry-pill { padding: 8px 14px; display: flex; gap: 16px; align-items: center; font-size: 12px; font-family: Consolas, monospace; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); display: inline-block; margin-right: 6px; }
        .status-dot.live { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }

        .elevation-drawer {
            position: absolute; left: 16px; right: 16px; bottom: 16px; height: 104px;
            z-index: 10; display: flex; flex-direction: column; padding: 10px 14px;
            transition: height 0.3s ease;
        }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .drawer-toggle { background: none; border: none; color: var(--cyan); cursor: pointer; font-weight: 700; font-size: 12px; }
        .elevation-canvas-container { flex: 1; position: relative; width: 100%; display: flex; align-items: flex-end; }
        
        .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95); color: #f8fafc; border: 1px solid var(--border-glass); border-radius: 10px; }
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); }
        .btn-add {
            margin-top: 8px; width: 100%; padding: 6px; background: var(--cyan); color: #090d16;
            border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="map" class="map-dark-filter"></div>

    <aside class="sidebar glass" id="sidebarPanel">
        <div class="brand">
            <h1>AEROGLASS NAV</h1>
            <span style="font-size:11px; color:var(--text-muted);">v0.3.0</span>
        </div>
        
        <button class="btn-action" onclick="importPlnFile()">📂 Importa File .pln (Downloads)</button>
        
        <!-- Configurazione SimBrief con ID Mascherato -->
        <div class="simbrief-box">
            <input type="password" id="simbriefIdInput" placeholder="SimBrief User ID (es. 123456)" onchange="saveSimbriefId(this.value)">
            <button class="btn-action btn-simbrief" style="width: auto; padding: 6px 12px;" onclick="fetchSimbriefPlan()">✈️ SimBrief</button>
        </div>

        <div class="search-box">
            <input type="text" id="omniSearch" placeholder="Cerca ICAO o Aeroporto..." oninput="filterAirports(this.value)">
        </div>
        <div class="section-title">Piano di Volo Attivo</div>
        <div class="fpl-list" id="fplContainer"></div>
    </aside>

    <div class="top-right">
        <select id="mapStyleSelect" class="glass layer-select" onclick="" onchange="switchMapStyle(this.value)">
            <option value="dark">Mappa: IFR Dark Cockpit</option>
            <option value="vfr">Mappa: VFR Day (OSM)</option>
            <option value="topo">Mappa: VFR Topo (Rilievi)</option>
            <option value="sat">Mappa: Satellite (Esri)</option>
        </select>

        <div class="telemetry-pill glass">
            <div><span id="simDot" class="status-dot"></span><span id="simStatus">DEMO</span></div>
            <div>ALT: <strong id="valAlt">---</strong> ft</div>
            <div>GS: <strong id="valGs">---</strong> kt</div>
            <div>HDG: <strong id="valHdg">---</strong>°</div>
        </div>
    </div>

    <div class="elevation-drawer glass" id="elevationDrawer">
        <div class="drawer-header">
            <span>Profilo Altitudinale & Terreno (VNAV)</span>
            <button class="drawer-toggle" onclick="toggleDrawer()">[ Riduci / Espandi ]</button>
        </div>
        <div class="elevation-canvas-container">
            <svg width="100%" height="52px" preserveAspectRatio="none" viewBox="0 0 1000 50">
                <path d="M0,50 L0,35 Q250,15 500,28 T1000,40 L1000,50 Z" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="1.5"/>
                <line x1="0" y1="15" x2="1000" y2="15" stroke="#e879f9" stroke-width="2" stroke-dasharray="6, 4"/>
                <text x="10" y="12" fill="#e879f9" font-size="9" font-family="monospace">FL065 (6,500 ft)</text>
            </svg>
        </div>
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([45.6, 11.4], 8);

        const tileSources = {
            osm: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            topo: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
            sat: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        };

        let currentTileLayer = L.tileLayer(tileSources.osm, { maxZoom: 19 }).addTo(map);

        function switchMapStyle(style) {
            const mapEl = document.getElementById('map');
            map.removeLayer(currentTileLayer);
            if (style === 'dark') {
                mapEl.classList.add('map-dark-filter');
                currentTileLayer = L.tileLayer(tileSources.osm, { maxZoom: 19 }).addTo(map);
            } else {
                mapEl.classList.remove('map-dark-filter');
                currentTileLayer = L.tileLayer(tileSources.osm, { maxZoom: style === 'topo' ? 17 : 19 }).addTo(map);
            }
        }

        let drawerOpen = true;
        function toggleDrawer() {
            drawerOpen = !drawerOpen;
            const drawer = document.getElementById('elevationDrawer');
            const sidebar = document.getElementById('sidebarPanel');
            if (drawerOpen) {
                drawer.style.height = '104px';
                sidebar.style.bottom = '130px';
            } else {
                drawer.style.height = '36px';
                sidebar.style.bottom = '60px';
            }
        }

        let airportsData = [];
        let flightPlan = [];
        let routeLine = null;
        let acftMarker = null;
        let initialized = false;

        const acftIcon = L.divIcon({
            className: '',
            html: '<div id="acftSvg" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 6px #38bdf8);"><svg viewBox="0 0 24 24" width="24" height="24" fill="#38bdf8"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>',
            iconSize: [28, 28], iconAnchor: [14, 14]
        });

        function renderMapElements() {
            airportsData.forEach(apt => {
                const marker = L.circleMarker([apt.lat, apt.lon], {
                    radius: 6, color: '#38bdf8', fillColor: '#0284c7', fillOpacity: 0.9, weight: 2
                }).addTo(map);

                marker.bindPopup(
                    '<div style="min-width:200px;">' +
                        '<div style="font-weight:700;font-size:14px;color:#38bdf8;">' + apt.icao + ' - ' + apt.name + '</div>' +
                        '<div style="font-size:11px;color:#94a3b8;margin:4px 0;">ELEV: ' + apt.elev + ' ft | RWY: ' + apt.rwy + ' | TWR: ' + apt.twr + '</div>' +
                        '<div style="font-size:11px;font-family:monospace;background:#090d16;padding:6px;border-radius:4px;color:#34d399;">' + apt.metar + '</div>' +
                        '<button class="btn-add" onclick="addWaypoint(\'' + apt.icao + '\')">+ Aggiungi a Rotta</button>' +
                    '</div>'
                );
            });
            updateFlightPlanUI();
        }

        function updateFlightPlanUI() {
            const container = document.getElementById('fplContainer');
            container.innerHTML = '';
            const coords = [];

            flightPlan.forEach(icao => {
                const apt = airportsData.find(a => a.icao === icao);
                if (apt) {
                    coords.push([apt.lat, apt.lon]);
                    const div = document.createElement('div');
                    div.className = 'wpt-card';
                    div.onclick = () => map.flyTo([apt.lat, apt.lon], 11);
                    div.innerHTML =
                        '<div>' +
                            '<div class="wpt-icao">' + apt.icao + '</div>' +
                            '<div class="wpt-name">' + apt.name + '</div>' +
                        '</div>' +
                        '<div style="font-size:11px;color:#94a3b8;">RWY ' + apt.rwy + '</div>';
                    container.appendChild(div);
                } else {
                    const div = document.createElement('div');
                    div.className = 'wpt-card';
                    div.innerHTML = '<div><div class="wpt-icao">' + icao + '</div><div class="wpt-name">Waypoint Navlog</div></div>';
                    container.appendChild(div);
                }
            });

            if (routeLine) map.removeLayer(routeLine);
            if (coords.length > 1) {
                routeLine = L.polyline(coords, { color: '#e879f9', weight: 3, dashArray: '8, 6' }).addTo(map);
                map.fitBounds(routeLine.getBounds(), { padding: [80, 80] });
            }
        }

        async function addWaypoint(icao) {
            if (window.pywebview && window.pywebview.api) {
                flightPlan = await window.pywebview.api.add_to_flight_plan(icao);
                updateFlightPlanUI();
            }
        }

        async function importPlnFile() {
            if (window.pywebview && window.pywebview.api) {
                const res = await window.pywebview.api.load_pln_file();
                if (res.success) {
                    flightPlan = res.flight_plan;
                    updateFlightPlanUI();
                }
            }
        }

        async function saveSimbriefId(val) {
            if (window.pywebview && window.pywebview.api) {
                await window.pywebview.api.save_simbrief_id(val);
            }
        }

        async function fetchSimbriefPlan() {
            if (window.pywebview && window.pywebview.api) {
                const res = await window.pywebview.api.fetch_simbrief_plan();
                if (res.success) {
                    flightPlan = res.flight_plan;
                    updateFlightPlanUI();
                    alert("Piano di volo SimBrief importato con successo!");
                } else {
                    alert("Errore SimBrief: " + (res.error || "ID non valido o nessun volo attivo"));
                }
            }
        }

        function filterAirports(query) {
            const q = query.toUpperCase().trim();
            const found = airportsData.find(a => a.icao.includes(q) || a.name.toUpperCase().includes(q));
            if (found && q.length >= 3) {
                map.flyTo([found.lat, found.lon], 10);
            }
        }

        async function pollTelemetry() {
            if (!window.pywebview || !window.pywebview.api) return;
            const data = await window.pywebview.api.get_telemetry();
            document.getElementById('simStatus').innerText = data.mode;
            document.getElementById('simDot').className = 'status-dot' + (data.connected ? ' live' : '');
            document.getElementById('valAlt').innerText = data.alt_ft;
            document.getElementById('valGs').innerText = data.gs_kt;
            document.getElementById('valHdg').innerText = data.hdg_deg;

            if (!acftMarker) {
                acftMarker = L.marker([data.lat, data.lon], { icon: acftIcon }).addTo(map);
            } else {
                acftMarker.setLatLng([data.lat, data.lon]);
            }
            const svgEl = document.getElementById('acftSvg');
            if (svgEl) svgEl.style.transform = 'rotate(' + data.hdg_deg + 'deg)';
        }

        async function initApp() {
            if (initialized || !window.pywebview || !window.pywebview.api) return;
            initialized = true;
            map.invalidateSize();
            await window.pywebview.api.connect_sim();
            const nav = await window.pywebview.api.get_navdata();
            airportsData = nav.airports;
            flightPlan = nav.flight_plan;
            if (nav.simbrief_userid) {
                document.getElementById('simbriefIdInput').value = nav.simbrief_userid;
            }
            renderMapElements();
            pollTelemetry();
            setInterval(pollTelemetry, 1000);
        }

        window.addEventListener('pywebviewready', initApp);
        setTimeout(initApp, 600);
    </script>
</body>
</html>
